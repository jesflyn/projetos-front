<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <title>Login Mario</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libertinus+Serif+Display&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');

/*pasta css do projeto login
*/

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Raleway', sans-serif;
}
div a{
     font-family: "Raleway", sans-serif;
  font-optical-sizing: auto;
  font-weight: 600;
  font-style: italic;
  color: rgb(236, 232, 232)


}
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-image: url('https://t.ctcdn.com.br/2izS7Ky-BYBtmGVEAePnk449sBg=/1200x675/smart/i282364.png');
    background-size: cover;
    background-position: center;

}
.login-container {
    width: 400px;
    background-color: rgba(0, 0, 0, 0.5);
    border-radius: 8px;
    padding: 2rem;
    box-shadow: 10px 5px 5px rgba(44, 32, 32, 0.8);
    position: relative;
    backdrop-filter: blur(10px);
}
.login-container h1 {
    margin-bottom: 1.5rem;
    text-align: center;
    color: #ffffff;
}
.input-container {
    position: relative;
    width: 100%;
    margin: 10px 0;
    left: 10px;
    border-radius: 40px;
    box-shadow: 0 0 10px rgba(44, 32, 32, 0.8);
}

/* margin & padding
margin:20px - aplica em todos os lados
margin:10px 20px - aplica 10px em cima e embaixo e 20px nas laterais
margin:10px 20px 30px 40px - aplica 10px em cima, 20px na direita, 30px embaixo e 40px na esquerda
padding segue os mesmos princípios
 */

.input-container input {

   width: 100%;
   height: 100%;
   border: 2px solid #ffffff;
   border-radius: 40px;
   outline: none;
   font-size: 16px;
   background: transparent;
   color: #ffffff;
   padding: 20px 45px 20px 20px;
}
.input-container input::placeholder{
    color: #d8d8da;
}
.input-container i {
    color: #f5f4f4;
    position: absolute;
    right: 20px;
    top:50%;
    transform: translateY(-50%);
    font-size: 20px;
}
.senha {
    color: #ffffff;
    display:flex;
   justify-content: space-between;
}
.senha label input{
   accent-color: #ffffff;
   font-size: 14px;
   text-align: center;
}
.senha a {
    
    text-decoration: none;
    font-size: 14px;
}
.senha a:hover {
    text-decoration: underline;
    color:#cb97ee;
    transition: 1s;
}
button {
    width: 100%;
    padding: 15px;
   background-color: #148c38;
   color: rgba(255, 255, 255, 0.932);
   border: none;
   border-radius: 40px;
   cursor: pointer;
   font-size: 16px;
   margin:10px 10px;
   font-weight: 600;
   box-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
}
button:hover {
   background-color: #4A148C;
   transition: 2s;
}
.cadastro a {
   
   text-decoration: none;
   
}
.cadastro a:hover {
   text-decoration: underline;
   color: #cb97ee;
   transition: 1s;
}
.cadastro p {
   color: #ffffff;
   font-size: 14px;
   text-align: center;
   margin:auto
  
}

    </style>
</head>
<body>
   <main class="login-container">
    <form>
        <h1>Meu Login</h1>
        <div class="input-container">
            <input placeholder="Usuário" type="e-mail">
            <i class='bx bxs-user'></i>
        </div>
         <div class="input-container">
            <input placeholder="Senha" type="password">
            <i class='bx bxs-lock-alt'></i>
        
        </div>
        <div class="senha">
            <label>
                <input type="checkbox">
               Lembrar senha
            </label>
           <a href="#">Esqueci a senha</a>
        </div>

        <button type="submit" class="login">Login</button>
        <div class="cadastro">
            <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
        </div>
    </form>
   </main>

</body>
</html>
